<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My Ups &amp; Downs</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ups &amp; Downs">
<meta name="theme-color" content="#5b3fa8">
<meta name="app-version" content="12">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%235b3fa8'/%3E%3Cpath d='M20 38l12-16 12 16z' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one narrow column — your total, log a point, then your log */
:root{
  --bg:#f5f4f9;--surface:#ffffff;--fg:#1c1a26;--muted:#6a6680;--line:#e2dfeb;
  --accent:#5b3fa8;--accent-soft:#ece7fa;
  --up:#1d8455;--up-soft:#e2f4ea;--down:#c03d2a;--down-soft:#fbe7e3;
  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --body:"Figtree",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121019;--surface:#1b1824;--fg:#ece9f5;--muted:#9a95ad;--line:#2d2939;
  --accent:#a68ff0;--accent-soft:#2a2340;
  --up:#4fc48a;--up-soft:#173126;--down:#f0755c;--down-soft:#3a1d18;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
.wrap{max-width:680px;margin:0 auto;padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:24px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--display);font-weight:800;font-size:clamp(2rem,8vw,2.8rem);line-height:1;margin:6px 0 8px;text-wrap:balance;letter-spacing:-.01em}
h2{font-family:var(--display);font-weight:600;font-size:1.15rem;margin:0}
.sub{color:var(--muted);font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.total{background:var(--accent-soft);border-color:transparent;gap:6px}
.t-body{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.big{font-family:var(--display);font-weight:800;font-size:clamp(3.2rem,16vw,4.6rem);line-height:1;font-variant-numeric:tabular-nums}
.big.pos{color:var(--up)}.big.neg{color:var(--down)}
.t-meta{font-family:var(--mono);font-size:13px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.t-meta .u{color:var(--up)}.t-meta .d{color:var(--down)}
.row{display:flex;gap:10px;flex-wrap:wrap}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em;flex:1 1 160px;min-width:0}
label.f.amt{flex:0 0 96px}
input{font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid transparent;color:inherit;background:none}
.b-up,.b-down{font-weight:600;font-size:16px;padding:12px}
.b-up{background:var(--up);color:var(--surface)}
.b-down{background:var(--down);color:var(--surface)}
.qrow{display:flex;gap:10px}
.qrow{align-items:flex-start}
.qrow textarea{flex:1;min-width:0;font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;resize:none;max-height:260px;overflow-y:auto;line-height:1.4}
.qrow textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.b-q{background:var(--accent);color:var(--surface);font-weight:600;font-size:16px;padding:10px 18px}
.gs-btn{width:100%}
.gs-setup{display:flex;flex-direction:column;gap:10px}
.gs-setup>label.f{flex:none}
.gs-who{font-size:13px;color:var(--muted);margin-bottom:8px}
.gs-confirm{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gs-change{align-self:flex-start;padding:2px 0}
.b-copy{width:100%;padding:12px;font-weight:600;font-size:15px;background:var(--surface);border:1px solid var(--line);color:var(--fg)}
.bkt{width:100%;min-height:90px;font:12px var(--mono);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
.status{font-size:13px;color:var(--muted);min-height:1em}
.status.err{color:var(--down)}
.tip{font-size:13px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:10px 12px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.e{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;padding:12px 14px;border-top:1px solid var(--line);align-items:start}
.e:first-child{border-top:0}
.meta{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;min-width:0}
.date{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:2px}
.from{font-weight:600;overflow-wrap:anywhere}
.why{grid-column:2/4;color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.why:empty{display:none}
.amtc{font-family:var(--mono);font-weight:700;font-size:13px;padding:2px 8px;border-radius:6px;white-space:nowrap}
.amtc.u{background:var(--up-soft);color:var(--up)}.amtc.d{background:var(--down-soft);color:var(--down)}
.x{color:var(--muted);font-size:13px;padding:2px 6px}
.x:hover{color:var(--down)}
.confirm{display:flex;gap:6px;align-items:center;font-size:13px;flex-wrap:wrap}
.confirm .yes{background:var(--down);color:var(--surface);padding:3px 10px}
.confirm .no{background:var(--line);color:var(--fg);padding:3px 10px}
.acts{display:flex;gap:2px;align-items:center}
.ef{display:flex;flex-direction:column;gap:10px;background:var(--accent-soft);align-items:stretch}
.card>label.f,.ef>label.f{flex:none}
.ef-row{display:flex;gap:10px;flex-wrap:wrap}
.ef select{font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 8px;width:100%}
.ef-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ef-save{background:var(--accent);color:var(--surface);font-weight:600;padding:10px}
.ef-cancel{background:var(--line);color:var(--fg);font-weight:600;padding:10px}
.empty{padding:22px 16px;color:var(--muted);text-align:center;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">ΣΠ · Pledge ledger</div>
    <h1>My Ups &amp; Downs</h1>
    <div class="sub">Your own log, saved on this phone. Nobody else sees it.</div>
  </header>

  <section class="card total" aria-live="polite">
    <span class="eyebrow">Your total</span>
    <div id="tot"></div>
  </section>

  <form class="card" id="q" autocomplete="off">
    <h2>Quick add</h2>
    <div class="qrow"><textarea id="qt" rows="1" aria-label="Type what happened, or paste lines from your notes"></textarea><button type="submit" class="b-q">Add</button></div>
    <div class="status" id="qs" role="status"></div>
  </form>

  <form class="card" id="f" autocomplete="off">
    <h2>Log a point</h2>
    <div class="row">
      <label class="f amt" for="am">Points<input id="am" type="number" inputmode="decimal" min="0.01" max="999" step="any" value="1" required></label>
      <label class="f" for="fr">From<input id="fr" type="text" placeholder="Who gave it (optional)" maxlength="40"></label>
    </div>
    <label class="f" for="rs">Reason<input id="rs" type="text" placeholder="e.g. Cleaned the kitchen" maxlength="120"></label>
    <div class="btns"><button type="submit" class="b-up" data-k="up">▲ Add up</button><button type="submit" class="b-down" data-k="down">▼ Add down</button></div>
    <div class="status" id="st" role="status"></div>
  </form>

  <div class="tip">Tip: tap Share → <b>Add to Home Screen</b> so it opens like an app. Always use the same phone and browser, since your log is saved there.</div>

  <section class="sec">
    <div class="sec-head"><h2>Your log</h2><span id="tools"></span></div>
    <div class="list" id="log"></div>
  </section>

  <section class="sec">
    <button type="button" class="b-copy" id="bk">Copy backup of all my data</button>
    <div class="status" id="bks" role="status"></div>
    <textarea id="bkt" class="bkt" readonly hidden aria-label="Backup code"></textarea>
  </section>

  <section class="card" id="gs">
    <h2>Google Sheet</h2>
    <div id="gsSetup" class="gs-setup">
      <div class="row">
        <label class="f" for="gsFirst">First name<input id="gsFirst" type="text" autocomplete="given-name" maxlength="40"></label>
        <label class="f" for="gsLast">Last name<input id="gsLast" type="text" autocomplete="family-name" maxlength="40"></label>
      </div>
      <label class="f" for="gsUrl">Sheet link (already filled in)<input id="gsUrl" type="url" inputmode="url" placeholder="https://script.google.com/macros/s/…/exec"></label>
      <button type="button" class="b-copy" id="gsSave">Save</button>
    </div>
    <div id="gsReady" hidden>
      <div class="gs-who" id="gsWho"></div>
      <button type="button" class="b-q gs-btn" id="gsGo">Update Google Sheet</button>
    </div>
    <div class="status" id="gss" role="status"></div>
    <div class="gs-confirm" id="gsConfirm" hidden>
      <button type="button" class="ef-save" id="gsYes">Update sheet</button><button type="button" class="ef-cancel" id="gsNo">Cancel</button>
    </div>
    <button type="button" class="x gs-change" id="gsChange" hidden>Change name or link</button>
  </section>
</div>

<script>
(function(){
  var LS='sigpi-my-updowns-v1';
  var editingId=null,lastBatch=[],entries=[],pendingDel=null,confirmClear=false,msg='',msgErr=false,lastKind='up',storageOk=true;

  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function f(x){return String(Math.round(x*100)/100)}
  function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
  function fmtDate(iso){var d=new Date(iso+'T12:00:00');return isNaN(d)?'':d.toLocaleDateString('en-US',{month:'short',day:'numeric'})}
  var idc=0;function newId(){idc++;return Date.now().toString(36)+idc.toString(36)+Math.random().toString(36).slice(2,6)}
  function clean(e){
    var n=Math.round(Math.min(Math.abs(Number(e.n))||1,999)*100)/100;
    return {id:String(e.id||newId()),kind:e.kind==='down'?'down':'up',n:n>0?n:1,
      from:String(e.from||'').trim().slice(0,40),reason:String(e.reason||'').trim().slice(0,120),
      date:/^\d{4}-\d{2}-\d{2}$/.test(e.date||'')?e.date:today()};
  }
  function load(){try{var v=localStorage.getItem(LS);var o=v?JSON.parse(v):null;return o&&Array.isArray(o.entries)?o.entries.map(clean):[]}catch(e){storageOk=false;return []}}
  function save(){try{localStorage.setItem(LS,JSON.stringify({entries:entries}));storageOk=true}catch(e){storageOk=false}}

  function render(){
    var u=0,d=0;entries.forEach(function(e){if(e.kind==='up')u+=e.n;else d+=e.n});var net=u-d;
    document.getElementById('tot').innerHTML=entries.length?
      '<div class="t-body"><span class="big '+(net>0?'pos':net<0?'neg':'')+'">'+(net>0?'+':'')+f(net)+'</span><div class="t-meta"><span class="u">▲'+f(u)+' ups</span><span class="d">▼'+f(d)+' downs</span><span>'+entries.length+(entries.length===1?' entry':' entries')+'</span></div></div>':
      '<div class="t-body"><span class="big">0</span><div class="t-meta"><span>Fresh start. Log your first up or down below.</span></div></div>';
    var st=document.getElementById('st');
    if(!storageOk){st.textContent='This browser isn’t saving data (private mode?). Your log will disappear when you close it.';st.className='status err'}
    else{st.textContent=msg;st.className='status'+(msgErr?' err':'')}
    document.getElementById('tools').innerHTML=entries.length?(confirmClear?'<span class="confirm">Delete your whole log? <button type="button" class="yes" id="clrY">Delete</button><button type="button" class="no" id="clrN">Keep</button></span>':'<button type="button" class="x" id="clr">Start over</button>'):'';
    var list=entries.map(function(e,i){return [e,i]}).sort(function(a,b){return a[0].date<b[0].date?1:a[0].date>b[0].date?-1:b[1]-a[1]});
    document.getElementById('log').innerHTML=list.length?list.map(function(p){
      var e=p[0],up=e.kind==='up';
      var tail=pendingDel===e.id?'<span class="confirm">Remove? <button type="button" class="yes" data-y="'+esc(e.id)+'">Yes</button><button type="button" class="no" data-n>No</button></span>':'<span class="acts"><button type="button" class="x" data-ed="'+esc(e.id)+'">Edit</button><button type="button" class="x" data-d="'+esc(e.id)+'" aria-label="Remove entry">Remove</button></span>';
      if(editingId===e.id){var k=esc(e.id);return '<form class="e ef" data-ef="'+k+'" autocomplete="off">'+
        '<div class="ef-row"><label class="f amt">Points<input name="n" type="number" inputmode="decimal" min="0.01" max="999" step="any" required value="'+f(e.n)+'"></label>'+
        '<label class="f amt">Type<select name="kind"><option value="up"'+(up?' selected':'')+'>Up</option><option value="down"'+(up?'':' selected')+'>Down</option></select></label>'+
        '<label class="f">Date<input name="date" type="date" required value="'+esc(e.date)+'"></label></div>'+
        '<label class="f">From<input name="from" type="text" maxlength="40" value="'+esc(e.from)+'" placeholder="Who gave it"></label>'+
        '<label class="f">Reason<input name="reason" type="text" maxlength="120" value="'+esc(e.reason)+'" placeholder="Why"></label>'+
        '<div class="ef-btns"><button type="submit" class="ef-save">Save</button><button type="button" class="ef-cancel" data-ec>Cancel</button></div></form>'}
      return '<div class="e"><span class="date">'+fmtDate(e.date)+'</span><span class="meta"><span class="amtc '+(up?'u':'d')+'">'+(up?'+':'−')+f(e.n)+(up?' up':' down')+'</span>'+(e.from?'<span class="from">'+esc(e.from)+'</span>':'')+'</span>'+tail+'<span class="why">'+esc(e.reason)+'</span></div>';
    }).join(''):'<div class="empty">Nothing logged yet.</div>';
  }

  var form=document.getElementById('f');
  form.addEventListener('click',function(ev){var b=ev.target.closest('button[data-k]');if(b)lastKind=b.getAttribute('data-k')});
  form.addEventListener('submit',function(ev){
    ev.preventDefault();
    var kind=(ev.submitter&&ev.submitter.getAttribute('data-k'))||lastKind;
    var n=parseFloat(document.getElementById('am').value);
    if(!(n>0)){msg='Enter a points amount above 0.';msgErr=true;render();return}
    var e=clean({kind:kind,n:n,from:document.getElementById('fr').value,reason:document.getElementById('rs').value,date:today()});
    entries.push(e);save();
    document.getElementById('rs').value='';document.getElementById('fr').value='';document.getElementById('am').value='1';
    msg=(kind==='up'?'▲ ':'▼ ')+f(e.n)+' '+(kind==='up'?'up':'down')+' added.';msgErr=false;render();
  });

  var BK='updowns-backup:';
  function backupCode(){var gc=null;try{gc=JSON.parse(localStorage.getItem('sigpi-sheet')||'null')}catch(e){}return BK+btoa(unescape(encodeURIComponent(JSON.stringify({v:1,s:gc,e:entries.map(function(e){return [e.id,e.kind==='down'?'d':'u',e.n,e.from,e.reason,e.date]})}))))}
  document.getElementById('bk').addEventListener('click',function(){
    var bks=document.getElementById('bks'),ta=document.getElementById('bkt');
    if(!entries.length){bks.textContent='Nothing to back up yet.';bks.className='status';return}
    var code=backupCode();
    function shown(){ta.hidden=false;ta.value=code;ta.focus();ta.select();bks.textContent='Couldn’t copy automatically. Select all the text below and copy it.';bks.className='status err'}
    try{navigator.clipboard.writeText(code).then(function(){ta.hidden=true;bks.textContent='Copied '+entries.length+(entries.length===1?' entry':' entries')+'. Save it in Notes. To restore, paste it into Quick add and tap Add.';bks.className='status'},shown)}catch(err){shown()}
  });
  function cap(s){return s.replace(/\b\w/g,function(c){return c.toUpperCase()})}
  function parse(text,ctx){
    ctx=ctx||{};
    var s=' '+String(text).replace(/[−–—]/g,'-').replace(/\s+/g,' ').trim()+' ';
    s=s.replace(/^\s*(?:[-•*·>~]+|\d+[.)](?=\s.*\d))\s*/,' ');
    var reason='',from='',each=0,date=ctx.date||today(),hasDate=false;
    var MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
    function mkDate(mo,d,y){
      mo=+mo;d=+d;if(!(mo>=1&&mo<=12&&d>=1&&d<=31))return null;
      var yr=y?(+y<100?2000+ +y:+y):new Date().getFullYear();
      var iso=yr+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0');
      if(!y&&iso>today())iso=(yr-1)+iso.slice(4);
      return iso;
    }
    var dm=s.match(/[\s(\[](\d{1,2})\/(\d{1,2})(?:\/(\d{2}|\d{4}))?(?=[\s,.:;)\]-])/);
    if(dm){var dd=mkDate(dm[1],dm[2],dm[3]);if(dd){date=dd;hasDate=true;s=s.replace(dm[0],' ')}}
    if(!hasDate){dm=s.match(/[\s(\[](jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec)[a-z]*\.?\s+(\d{1,2})(?:st|nd|rd|th)?(?:,?\s+(\d{4}))?(?=[\s,.:;)\]-])/i);
      if(dm){var dd2=mkDate(MON[dm[1].slice(0,3).toLowerCase()],dm[2],dm[3]);if(dd2){date=dd2;hasDate=true;s=s.replace(dm[0],' ')}}}
    var bare=s.replace(/\b(mon|tue|tues|wed|thu|thur|thurs|fri|sat|sun)(day|sday|nesday|rsday|urday)?\b/ig,' ').replace(/[^a-z0-9]+/ig,' ').trim();
    if(hasDate&&!bare)return {header:'date',date:date};
    if(/^\s*(ups?|downs?)\s*[:\-]?\s*$/i.test(s))return {header:'kind',kind:/down/i.test(s)?'down':'up'};
    if(/^\s*(total|net|sum)\b/i.test(s))return {skip:true};
    s=s.replace(/\s(?:from|by)\s*$/i,' ');
    var m=s.match(/\s(?:for|because|becuz|bc|b\/c|cuz|coz|cause|'cause|’cause|since|due to)\s+(.+)$/i);if(m){reason=m[1].trim();s=s.slice(0,m.index)+' '}
    if(reason&&!/\s(?:from|by)\s+[a-z]/i.test(s.replace(/\s(?:by|in)\s+\d+(?:\.\d+)?s\b/i,' '))){var rf=(' '+reason).match(/\s(?:from|by)\s+([a-z][\w.'’-]*(?:\s+[a-z][\w.'’-]*)?)\s*[.!]?$/i);if(rf){from=cap(rf[1]);reason=(' '+reason).slice(0,rf.index).trim()}}
    s=s.replace(/\s(?:by|in)\s+(\d+(?:\.\d+)?)s\b/i,function(_,x){each=parseFloat(x);return ' '});
    if(!from){m=s.match(/\s(?:by|from)\s+([a-z][\w.'’-]*(?:\s+[a-z][\w.'’-]*)?)\s*$/i)||s.match(/\s(?:by|from)\s+([a-z][\w.'’-]*)/i);
      if(m){from=cap(m[1].trim());s=s.replace(m[0],' ')}}
    var kind=null,n=null,words={one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19,twenty:20,thirty:30,forty:40,fifty:50,hundred:100,a:1,an:1,half:0.5,couple:2};
    var NW='one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|thirteen|fourteen|fifteen|sixteen|seventeen|eighteen|nineteen|twenty|thirty|forty|fifty|hundred|half|couple';
    m=s.match(/(\d+(?:\.\d+)?)\s*(ups?|downs?|u|d)\b/i);
    if(m){n=parseFloat(m[1]);kind=/^d/i.test(m[2])?'down':'up';s=s.replace(m[0],' ')}
    if(!kind){m=s.match(new RegExp('\\b(?:a\\s+)?('+NW+'|an?)\\s+(?:of\\s+)?(ups?|downs?)\\b','i'));if(m){n=words[m[1].toLowerCase()];kind=/^d/i.test(m[2])?'down':'up';s=s.replace(m[0],' ')}}
    if(!kind){m=s.match(/\b(ups?|downs?)\s*(?:x\s*)?(\d+(?:\.\d+)?)\b/i);if(m){n=parseFloat(m[2]);kind=/^d/i.test(m[1])?'down':'up';s=s.replace(m[0],' ')}}
    if(!kind){m=s.match(/(^|\s)([+-])\s?(\d+(?:\.\d+)?)\b/);if(m&&!(m[2]==='-'&&/\s-\s\d/.test(m[0]+' ')&&m[0].indexOf('- ')>-1)){n=parseFloat(m[3]);kind=m[2]==='+'?'up':'down';s=s.replace(m[0],' ')}}
    if(!kind&&/\b(ups?|downs?)\b/i.test(s)){kind=/\bdowns?\b/i.test(s)?'down':'up';s=s.replace(/\b(ups?|downs?)\b/i,' ')}
    if(n==null){m=s.match(/(?:^|\s)x?\s?(\d+(?:\.\d+)?)\b/i);if(m){n=parseFloat(m[1]);s=s.replace(m[0],' ')}}
    if(n==null){m=s.match(new RegExp('\\b(?:a\\s+)?('+NW+')\\b','i'));if(m){n=words[m[1].toLowerCase()];s=s.replace(m[0],' ')}}
    if(!kind)kind=ctx.kind||null;
    if(!kind&&n!=null){
      if(/\b(lose|loses|lost|losing|minus|deduct|deducted|dock|docked|penalty|subtract|take away|taken away|negative)\b/i.test(text))kind='down';
      else if(reason||from||/\b(take|takes|took|taking|get|gets|got|give|gives|gave|giving|receive|received|add|plus|everyone|everybody|y'?all|all of you|pc|pledges?)\b/i.test(text)||/(^|\s)\+\d/.test(text))kind='up';
    }
    if(!kind)return {err:'No up or down in this line.'};
    if(!(n>0))return {err:'No amount in this line.'};
    if(n>999)return {err:'Over 999 in one line.'};
    if(!from||!reason){
      var left=s.replace(/\b(take|takes|took|taking|give|gives|gave|got|get|gets|received|receive|me|i|my|everyone|everybody|y'?all|all|pledges?|guys|yourselves|yourself|you|please|pls|go ahead and|should|can|ok|okay|add|plus|of|ups?|downs?)\b/ig,' ').replace(/\s+/g,' ').trim();
      var segs=left.split(/\s[-|:]\s|:\s|\s-|-\s|,|\(|\)|\[|\]|\s\/\s/).map(function(x){return x.replace(/^[\s\-:|.]+|[\s\-:|.]+$/g,'')}).filter(function(x){return /[a-z0-9_]/i.test(x)});
      if(!from&&segs.length>1&&/^[a-z][\w.'’-]*(\s[a-z][\w.'’-]*)?$/i.test(segs[0])){from=cap(segs.shift())}
      if(!reason&&segs.length)reason=segs.join(' - ');
    }
    return {kind:kind,n:n,chunk:each,from:from,reason:reason,date:date};
  }
  document.getElementById('q').addEventListener('submit',function(ev){
    ev.preventDefault();
    var box=document.getElementById('qt'),qs=document.getElementById('qs');
    var raw=box.value.trim(),bi=raw.indexOf(BK);
    if(bi>-1){
      var data;try{data=JSON.parse(decodeURIComponent(escape(atob(raw.slice(bi+BK.length).replace(/\s+/g,'')))))}catch(err){data=null}
      if(!data||!Array.isArray(data.e)){qs.textContent='That backup code looks incomplete. Copy it again and paste the whole thing.';qs.className='status err';return}
      var have={},added=[];entries.forEach(function(e){have[e.id]=1});
      data.e.forEach(function(x){if(!Array.isArray(x))return;var e=clean({id:x[0],kind:x[1]==='d'?'down':'up',n:x[2],from:x[3],reason:x[4],date:x[5]});if(!have[e.id]){have[e.id]=1;entries.push(e);added.push(e.id)}});
      try{if(data.s&&data.s.url&&!localStorage.getItem('sigpi-sheet')){localStorage.setItem('sigpi-sheet',JSON.stringify(data.s));gsShow()}}catch(err){}
      lastBatch=added;save();box.value='';fit();
      qs.innerHTML=esc(added.length?'Restored '+added.length+(added.length===1?' entry':' entries'):'Everything in that backup is already here')+(added.length?' <button type="button" class="x" id="undo">Undo</button>':'');
      qs.className='status';msg='';render();return;
    }
    var lines=box.value.split(/\r?\n/).map(function(l){return l.trim()}).filter(Boolean);
    if(!lines.length){qs.textContent='Type what happened first.';qs.className='status err';return}
    var parsed=[],bad=[];
    var ctx={},skipped=0;lines.forEach(function(l){var r=parse(l,ctx);if(r.header==='date'){ctx.date=r.date;return}if(r.header==='kind'){ctx.kind=r.kind;return}if(r.skip||(r.err&&!/\d/.test(l))){skipped++;return}if(r.err)bad.push({line:l,err:r.err});else parsed.push(r)});
    if(!parsed.length&&!bad.length){qs.textContent=skipped?'No ups or downs found in that.':'Nothing to add in that.';qs.className='status err';return}
    if(lines.length===1&&bad.length){qs.textContent=bad[0].err;qs.className='status err';return}
    var total=0;parsed.forEach(function(r){total+=Math.ceil(r.n/(r.chunk>0?r.chunk:r.n)-1e-9)});
    if(total>50000){qs.textContent='That’s over 50,000 separate entries. Paste it in smaller pieces.';qs.className='status err';return}
    var batch=[],ups=0,downs=0;
    parsed.forEach(function(r){
      var chunk=r.chunk>0?r.chunk:r.n,count=Math.ceil(r.n/chunk-1e-9),left=r.n;
      for(var i=0;i<count;i++){var amt=Math.min(chunk,Math.round(left*100)/100);left-=amt;var e=clean({kind:r.kind,n:amt,from:r.from,reason:r.reason,date:r.date});entries.push(e);batch.push(e.id)}
      if(r.kind==='up')ups+=r.n;else downs+=r.n;
    });
    lastBatch=batch;if(batch.length)save();
    box.value=bad.map(function(b){return b.line}).join('\n');fit();
    var parts=[];if(ups)parts.push('▲ '+f(ups)+' up'+(ups===1?'':'s'));if(downs)parts.push('▼ '+f(downs)+' down'+(downs===1?'':'s'));
    var txt=parts.length?parts.join(', ')+' added'+(batch.length>1?' ('+batch.length+' entries)':''):'';
    if(bad.length)txt+=(txt?'. ':'')+bad.length+(bad.length===1?' line':' lines')+' couldn’t be read (left in the box to fix)';
    qs.innerHTML=esc(txt)+(batch.length?' <button type="button" class="x" id="undo">Undo</button>':'');
    qs.className='status'+(bad.length?' err':'');msg='';render();
  });
  function fit(){var t=document.getElementById('qt');t.style.height='auto';t.style.height=Math.min(t.scrollHeight+2,260)+'px'}
  document.getElementById('qt').addEventListener('keydown',function(ev){if(ev.key==='Enter'&&!ev.shiftKey&&!ev.isComposing){ev.preventDefault();var fm=document.getElementById('q');if(fm.requestSubmit)fm.requestSubmit();else fm.dispatchEvent(new Event('submit',{cancelable:true}))}});
  document.getElementById('qt').addEventListener('input',fit);
  document.getElementById('qt').addEventListener('input',function(){var qs=document.getElementById('qs');if(qs.className.indexOf('err')>-1){qs.textContent='';qs.className='status'}});

  document.addEventListener('submit',function(ev){
    var fm=ev.target.closest&&ev.target.closest('form[data-ef]');if(!fm)return;
    ev.preventDefault();
    var id=fm.getAttribute('data-ef'),n=parseFloat(fm.elements.n.value);
    if(!(n>0)){fm.elements.n.focus();return}
    for(var i=0;i<entries.length;i++)if(entries[i].id===id){entries[i]=clean({id:id,kind:fm.elements.kind.value,n:n,from:fm.elements.from.value,reason:fm.elements.reason.value,date:fm.elements.date.value||entries[i].date});break}
    editingId=null;save();msg='Entry updated.';msgErr=false;render();
  });

  document.addEventListener('click',function(ev){
    var t=ev.target;
    if(t.closest('#undo')){var ids=lastBatch;entries=entries.filter(function(e){return ids.indexOf(e.id)<0});lastBatch=[];save();var q=document.getElementById('qs');q.textContent='';q.className='status';render();return}
    if(t.closest('#clr')){confirmClear=true;render();return}
    if(t.closest('#clrN')){confirmClear=false;render();return}
    if(t.closest('#clrY')){entries=[];confirmClear=false;save();msg='Log cleared.';msgErr=false;render();return}
    var ed=t.closest('[data-ed]');if(ed){editingId=ed.getAttribute('data-ed');pendingDel=null;render();var fm=document.querySelector('form[data-ef]');if(fm){fm.scrollIntoView({block:'nearest'});var fi=fm.querySelector('input[name=from]');if(fi&&!fi.value)fi.focus()}return}
    if(t.closest('[data-ec]')){editingId=null;render();return}
    var d=t.closest('[data-d]');if(d){pendingDel=d.getAttribute('data-d');render();return}
    if(t.closest('[data-n]')){pendingDel=null;render();return}
    var y=t.closest('[data-y]');if(y){var id=y.getAttribute('data-y');entries=entries.filter(function(e){return e.id!==id});pendingDel=null;save();render()}
  });

  var VER='12';
  function checkUpdate(){
    if(!window.fetch)return;
    fetch(location.pathname+'?check='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.text():''}).then(function(t){
      var m=t.match(/name="app-version" content="([^"]+)"/);if(!m||m[1]===VER)return;
      var tried='';try{tried=sessionStorage.getItem('ud-tried')||''}catch(e){}
      if(tried===m[1])return;try{sessionStorage.setItem('ud-tried',m[1])}catch(e){}
      location.replace(location.pathname+'?v='+m[1]);
    }).catch(function(){});
  }
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')checkUpdate()});

  entries=load();
  render();
  checkUpdate();

  var GSK='sigpi-sheet',gsPending=null,GS_DEFAULT='https://script.google.com/a/macros/scu.edu/s/AKfycbyJRta6ugHgfDqV9VOw160CAExHAhGXyKVmJnWezfeWidgkbzzPQ1vyjCKsCtjs-TifBA/exec';
  function gsCfg(){try{var o=JSON.parse(localStorage.getItem(GSK)||'null');return o&&o.url?o:null}catch(e){return null}}
  function gsSet(o){try{if(o)localStorage.setItem(GSK,JSON.stringify(o));else localStorage.removeItem(GSK)}catch(e){}}
  function gsShow(){var c=gsCfg();document.getElementById('gsSetup').hidden=!!c;document.getElementById('gsReady').hidden=!c;document.getElementById('gsChange').hidden=!c;document.getElementById('gsConfirm').hidden=true;
    if(c)document.getElementById('gsWho').textContent='Updates the row for '+c.first+' '+c.last+'.'}
  function gsMsg(t,err){var el=document.getElementById('gss');el.textContent=t;el.className='status'+(err?' err':'')}
  function num(v){var x=parseFloat(String(v==null?'':v).replace(/,/g,''));return isFinite(x)?x:0}
  function totals(){var u=0,d=0;entries.forEach(function(e){if(e.kind==='up')u+=e.n;else d+=e.n});u=Math.round(u*1000)/1000;d=Math.round(d*1000)/1000;return {u:u,d:d,n:Math.round((u-d)*1000)/1000}}
  function gsCall(params){var c=gsCfg();params.first=c.first;params.last=c.last;if(c.token)params.token=c.token;
    var q=Object.keys(params).map(function(k){return k+'='+encodeURIComponent(params[k])}).join('&');
    return fetch(c.url+'?'+q+'&t='+Date.now(),{redirect:'follow'}).catch(function(){throw new Error('Couldn’t connect to the sheet link. It may only allow people signed in to Google (ask Gavin).')}).then(function(r){return r.json().catch(function(){throw new Error('The sheet link sent back a Google sign-in page instead of data (ask Gavin).')})}).then(function(j){if(!j||!j.ok)throw new Error((j&&j.error)||'The sheet didn’t answer.');return j})}
  document.getElementById('gsSave').addEventListener('click',function(){
    var first=document.getElementById('gsFirst').value.trim(),last=document.getElementById('gsLast').value.trim(),url=document.getElementById('gsUrl').value.trim();
    if(!first||!last){gsMsg('Enter your first and last name exactly as they are in the sheet.',true);return}
    if(!/^https:\/\/script\.google\.com\/(?:a\/macros\/[\w.-]+|macros)\/s\/[\w-]+\/exec$/.test(url)){gsMsg('That doesn’t look like the sheet link. It starts with https://script.google.com/macros/s/ and ends with /exec.',true);return}
    var old=gsCfg(),same=old&&old.url===url&&old.first.toLowerCase()===first.toLowerCase()&&old.last.toLowerCase()===last.toLowerCase();
    gsSet({first:first,last:last,url:url,token:same?old.token:(old&&old.token&&old.first.toLowerCase()===first.toLowerCase()&&old.last.toLowerCase()===last.toLowerCase()?old.token:'')});
    gsShow();gsMsg('Checking the sheet for '+first+' '+last+'…');
    gsCall({action:'get'}).then(function(j){gsMsg(j.claimedByOther?'Found your row, but it’s already linked to another phone. Ask the sheet owner to reset it.':'Found your row. You’re all set.',!!j.claimedByOther)}).catch(function(e){document.getElementById('gsChange').click();gsMsg(e.message,true)});
  });
  document.getElementById('gsChange').addEventListener('click',function(){var c=gsCfg();if(c){document.getElementById('gsFirst').value=c.first;document.getElementById('gsLast').value=c.last;document.getElementById('gsUrl').value=c.url||GS_DEFAULT}
    document.getElementById('gsSetup').hidden=false;document.getElementById('gsReady').hidden=true;document.getElementById('gsChange').hidden=true;document.getElementById('gsConfirm').hidden=true;gsMsg('')});
  document.getElementById('gsGo').addEventListener('click',function(){
    var t=totals();gsMsg('Checking the sheet…');document.getElementById('gsConfirm').hidden=true;
    gsCall({action:'get'}).then(function(j){
      if(j.claimedByOther){gsMsg('Your row is linked to another phone, so this one can’t change it. Ask the sheet owner to reset it.',true);return}
      gsPending=t;
      gsMsg((j.name?j.name+' — ':'')+'sheet now: ▲'+f(num(j.ups))+' ups, ▼'+f(num(j.downs))+' downs, net '+f(num(j.net))+'. Change it to ▲'+f(t.u)+' ups, ▼'+f(t.d)+' downs, net '+f(t.n)+'?');
      document.getElementById('gsConfirm').hidden=false;
    }).catch(function(e){gsMsg('Couldn’t reach the sheet: '+e.message,true)});
  });
  document.getElementById('gsNo').addEventListener('click',function(){gsPending=null;document.getElementById('gsConfirm').hidden=true;gsMsg('')});
  document.getElementById('gsYes').addEventListener('click',function(){
    if(!gsPending)return;var t=gsPending;gsPending=null;document.getElementById('gsConfirm').hidden=true;gsMsg('Updating…');
    gsCall({action:'set',ups:t.u,downs:t.d}).then(function(j){var c=gsCfg();if(j.token&&c){c.token=j.token;gsSet(c)}
      gsMsg('Sheet updated: ▲'+f(num(j.ups))+' ups, ▼'+f(num(j.downs))+' downs, net '+f(num(j.net))+'.')}).catch(function(e){gsMsg('Couldn’t update the sheet: '+e.message,true)});
  });
  document.getElementById('gsUrl').value=GS_DEFAULT;
  try{var oldUrl=localStorage.getItem('sigpi-sheet-url');if(oldUrl)localStorage.removeItem('sigpi-sheet-url')}catch(e){}
  gsShow();
})();
</script>
